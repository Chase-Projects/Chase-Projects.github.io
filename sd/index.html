<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>San Diego Completionist</title>
<meta name="description" content="Checklists for San Diego completionists: the Mission Trails 5 peaks, summits, every library, every transit line, every museum. Progress saves in your browser.">
<script>try{var t=localStorage.getItem('sdpp.theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f7f3ec; --surface:#fffdf9; --ink:#1f2a33; --muted:#6b7780; --line:#e6dfd3;
  --accent:#0e7c86; --accent-ink:#fff; --done:#2f9e5b; --todo:#8a5a3b; --soft:#eaf5ee;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171c; --surface:#182129; --ink:#e8eef2; --muted:#93a2ad; --line:#2a3640;
    --accent:#3fb5be; --accent-ink:#0b1216; --done:#53c784; --todo:#b88660; --soft:#17302a;
  }
}
:root[data-theme="dark"]{
  --bg:#11171c; --surface:#182129; --ink:#e8eef2; --muted:#93a2ad; --line:#2a3640;
  --accent:#3fb5be; --accent-ink:#0b1216; --done:#53c784; --todo:#b88660; --soft:#17302a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
svg.lucide{width:18px;height:18px;stroke-width:2;flex:none;vertical-align:middle}
header{padding:28px 0 0;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(26px,5vw,36px);margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.overall{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:10px}
.theme{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
.theme:hover{color:var(--accent)}
.theme svg.lucide{width:17px;height:17px}

nav.tabs{position:sticky;top:0;z-index:1200;background:var(--bg);border-bottom:1px solid var(--line);margin-top:14px}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:12px 10px 10px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab .count.full{color:var(--done);font-weight:600}
.sep{width:1px;background:var(--line);margin:12px 6px;flex:none}

main{padding:18px 0 40px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;margin-bottom:12px}
h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:24px;margin:0}
.blurb{color:var(--muted);margin:2px 0 0}
.progress{min-width:180px;flex:0 1 240px}
.progress .nums{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.progress strong{color:var(--ink);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--done);border-radius:inherit;transition:width .3s}

.tiers{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.tier{display:flex;align-items:center;gap:6px;font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.tier.on{border-color:var(--done);color:var(--done);background:var(--soft);font-weight:600}
.tier svg.lucide{width:14px;height:14px}

#map{height:360px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.leaflet-container{font:inherit}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)} }
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
.leaflet-popup-content{margin:10px 12px}
.pop b{display:block;font-size:14px;margin-bottom:6px}

.award{margin:14px 0;padding:12px 14px;border-radius:12px;border:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px}
.award .l{display:flex;gap:8px;align-items:center}
.award.ready{border:1px solid var(--done);background:var(--soft);color:var(--ink)}
.award form{display:flex;gap:8px;flex-wrap:wrap}
input[type=text],input[type=search],input[type=date],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input[type=date]{padding:3px 6px;font-size:12px;color:var(--muted)}
.btn{appearance:none;font:inherit;font-weight:600;border:0;border-radius:8px;padding:7px 12px;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;gap:6px;align-items:center}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line)}
.btn.sm{padding:4px 9px;font-size:13px}

.tools{display:flex;gap:8px;align-items:center;margin:14px 0 10px;flex-wrap:wrap}
.search{flex:1;min-width:160px;position:relative}
.search input{width:100%;padding-left:32px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toggle{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}

#items{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card h3{display:flex;justify-content:space-between;align-items:center;margin:0;padding:10px 14px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--line)}
.card h3 .full{color:var(--done)}
.card ul{list-style:none;margin:0;padding:0}
.thumb{width:56px;height:40px;flex:none;display:grid;place-items:center}
.thumb img{max-width:40px;max-height:40px;width:auto;height:auto;object-fit:contain;border-radius:6px}
.thumb.logo.wide img{max-width:56px;max-height:32px;border-radius:0}
.thumb.mono{background:var(--ink);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;width:56px;height:36px}
.thumb.badge{width:32px;height:32px;margin:0 12px;border-radius:999px;color:#fff;font-size:14px;font-weight:700;letter-spacing:-.02em}
.thumb.badge svg.lucide{width:18px;height:18px}
.thumb.plain{color:var(--accent)}
.thumb.plain svg.lucide{width:26px;height:26px;stroke-width:1.75}
.thumb.svg img{max-width:40px;max-height:40px;border-radius:0}
.thumb.svg.wide img{max-width:56px;max-height:30px}
.thumb.pill{width:52px;height:28px;margin:0 2px;border-radius:999px;color:#fff;font-size:16px;font-weight:700;letter-spacing:-.01em}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .thumb.ink img{background:#e8eef2;padding:3px} }
:root[data-theme="dark"] .thumb.ink img{background:#e8eef2;padding:3px}
.dateclr{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;display:inline-flex}
.dateclr:hover{color:var(--ink);background:var(--bg)}
.dateclr svg.lucide{width:15px;height:15px}
.adddate{font-size:12px;color:var(--muted)}
li.item{display:flex;gap:12px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
li.item:first-child{border-top:0}
li.item input[type=checkbox]{width:19px;height:19px;margin:0;accent-color:var(--done);cursor:pointer;flex:none}
.body{flex:1;min-width:0}
.name{font-weight:500;cursor:pointer}
.name:hover{color:var(--accent)}
li.done .name{color:var(--muted)}
.meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:2px;align-items:center;flex:none}
.icon{display:inline-flex;padding:6px;border-radius:8px;color:var(--muted)}
.icon:hover{color:var(--accent);background:var(--bg)}
.empty{padding:20px;text-align:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px}
.counter{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.combo{position:relative}
.counter input{width:170px;padding:4px 8px;font-size:13px}
.sugg{position:absolute;left:0;top:calc(100% + 4px);z-index:1100;min-width:280px;max-width:min(360px,80vw);max-height:260px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px}
.sugg button{appearance:none;display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;padding:6px 8px;border-radius:6px;cursor:pointer}
.sugg button:hover,.sugg button.on{background:var(--bg)}
.sugg b{min-width:34px;text-align:center;font-size:12px;background:var(--soft);color:var(--done);border-radius:5px;padding:1px 4px}
.sugg .none{padding:6px 8px;font-size:13px;color:var(--muted)}
.rt{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:600;background:var(--soft);color:var(--done);border-radius:6px;padding:2px 4px 2px 7px}
.rt .rtn{font-weight:500;margin-left:5px;opacity:.85}
.rt button{appearance:none;border:0;background:none;color:inherit;cursor:pointer;padding:0 2px;font-size:14px;line-height:1}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:2000}
.toast.show{opacity:1}
@media (max-width:640px){ #map{height:260px} .progress{flex-basis:100%} }
</style>
</head>
<body>
<header class="wrap">
  <h1>San Diego <span>Completionist</span></h1>
  <div class="overall"><span id="overall"></span><button class="theme" id="theme" aria-label="Toggle dark mode" title="Toggle dark mode"></button></div>
</header>

<nav class="tabs" aria-label="Lists"><div class="wrap" role="tablist" id="tabs"></div></nav>

<main class="wrap" role="tabpanel">
  <div class="head">
    <div><h2 id="title"></h2><p class="blurb" id="blurb"></p></div>
    <div class="progress"><div class="nums"><span id="frac"></span><strong id="pct"></strong></div><div class="bar"><i id="bar"></i></div></div>
  </div>
  <div class="tiers" id="tiers" hidden></div>
  <div id="map" aria-label="Map"></div>
  <div class="award" id="award"></div>
  <div class="tools">
    <div class="search"><i data-lucide="search"></i><input type="search" id="q" placeholder="Search" aria-label="Search this list"></div>
    <label class="toggle"><input type="checkbox" id="hideDone"> Hide done</label>
  </div>
  <div class="chips" id="chips" style="margin-bottom:10px"></div>
  <div id="items"></div>
</main>

<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="data.js?v=8"></script>
<script>
(function(){
const LISTS = window.SD_LISTS;
const KEY = 'sdpp.v1';
// transparent dark logos that get a light backing in dark mode
const INK = new Set(['chulavistaca.gov','coronadohistory.org','cuyamaca.edu','newamericansmuseum.org','sandiegoairandspace.org','sdcity.edu','sdmart.org','swccd.edu','veteranmuseum.org']);
const $ = id => document.getElementById(id);
const icons = () => window.lucide && lucide.createIcons();

// ---- state (per-browser, localStorage) ----
let state = { done:{}, name:'', bus:[] };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.done) state = Object.assign(state, s); } catch(e){}
(function(){ const t=LISTS.find(l=>l.bus); if (!t) return; state.bus=state.bus.filter(r=>t.bus.includes(r)); const it=t.items.find(i=>i.counter); if (it && state.bus.length<it.counter) delete state.done[it.id]; })();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

const today = () => { const d=new Date(); return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const fmtDate = s => s && s!=='-' ? new Date(s+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) : '';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const countDone = l => l.items.filter(i=>state.done[i.id]).length;
const mapsUrl = i => 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(i.q || (i.lat+','+i.lng));
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2200); }

// ---- map ----
const map = L.map('map',{scrollWheelZoom:false}).setView([32.8,-117.15],11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
const layer = L.layerGroup().addTo(map);
let markers = {};

// ---- tabs / filters ----
let current = LISTS.find(l=>'#'+l.key===location.hash) || LISTS[0];
let groupFilter = null;
function renderTabs(){
  let html='', sep=false;
  LISTS.forEach(l=>{
    if (l.personal && !sep){ html+='<span class="sep" aria-hidden="true"></span>'; sep=true; }
    const n=countDone(l), N=l.items.length;
    html+=`<button class="tab" role="tab" aria-selected="${l===current}" data-key="${l.key}"><i data-lucide="${l.icon}"></i>${esc(l.short)} <span class="count${n===N?' full':''}">${n}/${N}</span></button>`;
  });
  $('tabs').innerHTML=html;
  const uniq=new Set(LISTS.flatMap(l=>l.items.map(i=>i.id)));
  $('overall').textContent=`${[...uniq].filter(id=>state.done[id]).length} of ${uniq.size} done`;
}
$('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  current=LISTS.find(l=>l.key===b.dataset.key); groupFilter=null; $('q').value='';
  history.replaceState(null,'','#'+current.key);
  render(true);
});
const groups = l => [...new Set(l.items.map(i=>i.g))];

function metaFor(i){
  const b=[];
  if (i.elev) b.push(i.elev.toLocaleString()+' ft');
  if (i.meta) b.push(i.meta);
  return b.join(' · ');
}

// ---- 5-peak time tiers ----
function tierInfo(l){
  const ds=l.items.map(i=>state.done[i.id]);
  if (ds.some(d=>!d)) return {day:false,week:false,all:false};
  if (ds.some(d=>d==='-')) return {day:false,week:false,all:true};
  const t=ds.map(d=>new Date(d+'T12:00').getTime()), span=Math.round((Math.max(...t)-Math.min(...t))/864e5);
  return {day:span===0, week:span<=6, all:true};
}
const bestTier = ti => ti.day?'In One Day':ti.week?'In One Week':'All Time';

function render(fit){
  const l=current, n=countDone(l), N=l.items.length;
  renderTabs();
  $('title').textContent=l.title;
  $('blurb').textContent=l.blurb;
  $('frac').textContent=`${n} of ${N} ${l.unit}`;
  $('pct').textContent=Math.round(100*n/N)+'%';
  $('bar').style.width=(100*n/N)+'%';
  const tiers=$('tiers');
  if (l.timed && n===N){
    const ti=tierInfo(l);
    tiers.hidden=false;
    tiers.innerHTML=[['day','Day','sun'],['week','Week','calendar-days'],['all','All time','infinity']]
      .map(([k,label,ic])=>`<span class="tier${ti[k]?' on':''}"><i data-lucide="${ti[k]?'circle-check':ic}"></i>${label}</span>`).join('');
  } else tiers.hidden=true;
  const g=groups(l);
  $('chips').innerHTML = g.length>1 ? ['All',...g].map(x=>`<button class="chip" aria-pressed="${(x==='All'&&!groupFilter)||x===groupFilter}" data-g="${esc(x)}">${esc(x)}</button>`).join('') : '';
  renderAward(l,n,N);
  renderItems();
  renderMap(fit);
  icons();
}
$('chips').addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  groupFilter = c.dataset.g==='All'?null:c.dataset.g;
  render(true);
});

function visible(){
  const q=$('q').value.trim().toLowerCase(), hide=$('hideDone').checked;
  return current.items.filter(i=>(!groupFilter||i.g===groupFilter)&&(!hide||!state.done[i.id])&&(!q||(i.name+' '+i.g+' '+(i.meta||'')+' '+(i.q||'')).toLowerCase().includes(q)));
}

function renderMap(fit){
  layer.clearLayers(); markers={};
  const css=getComputedStyle(document.documentElement);
  const cDone=css.getPropertyValue('--done').trim(), cTodo=css.getPropertyValue('--todo').trim();
  const pts=[];
  visible().forEach(i=>{
    if (i.lat==null) return;
    const d=!!state.done[i.id];
    const m=L.circleMarker([i.lat,i.lng],{radius:7,weight:2,color:'#fff',fillColor:d?cDone:cTodo,fillOpacity:1})
      .bindPopup(()=>`<div class="pop"><b>${esc(i.name)}</b><button class="btn sm" data-toggle="${i.id}">${state.done[i.id]?'Undo':'Mark done'}</button></div>`)
      .addTo(layer);
    if (d) m.bringToFront();
    markers[i.id]=m; pts.push([i.lat,i.lng]);
  });
  if (current.key==='transit') drawRoutes(cDone);
  if (current.path) L.polyline(current.path,{color:css.getPropertyValue('--accent').trim(),weight:4,opacity:.85,interactive:false}).addTo(layer).bringToBack();
  if (fit && pts.length) map.fitBounds(current.path||pts,{padding:[30,30],maxZoom:14});
}
let routesLoading=false;
function drawRoutes(){
  if (!window.SD_ROUTES){
    if (!routesLoading){ routesLoading=true; const sc=document.createElement('script'); sc.src='routes.js?v=1'; sc.onload=()=>renderMap(false); document.head.appendChild(sc); }
    return;
  }
  visible().filter(i=>i.route && SD_ROUTES[i.id]).forEach(i=>{
    const r=SD_ROUTES[i.id], d=!!state.done[i.id];
    const pl=L.polyline(r.segs,{color:r.color,weight:d?8:5,opacity:d?1:.75,dashArray:r.dash?'8 8':null})
      .bindPopup(()=>`<div class="pop"><b>${esc(i.name)}</b><button class="btn sm" data-toggle="${i.id}">${state.done[i.id]?'Undo':'Mark done'}</button></div>`)
      .addTo(layer);
    if (d) pl.bringToFront(); else pl.bringToBack();
  });
  Object.values(markers).forEach(m=>m.bringToFront());
}
map.on('popupopen',e=>{
  const btn=e.popup.getElement().querySelector('[data-toggle]');
  if (btn) btn.onclick=()=>{ toggle(btn.dataset.toggle); map.closePopup(); };
});

function counterHtml(i){
  const nm=current.busNames||{};
  return `<div class="counter">${state.bus.map(r=>`<span class="rt">${esc(r)}${nm[r]?`<span class="rtn">${esc(nm[r])}</span>`:''}<button data-rm="${esc(r)}" aria-label="Remove route ${esc(r)}">×</button></span>`).join('')}
    <span class="combo"><input type="search" placeholder="Add a route" data-add="1" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sugg" aria-label="Search bus routes by number or name"><div class="sugg" id="sugg" role="listbox" hidden></div></span>
    <span class="meta">${Math.min(state.bus.length,i.counter)}/${i.counter}${state.bus.length>i.counter?` (${state.bus.length} total)`:''}</span></div>`;
}

function thumb(i){
  if (i.img) return `<span class="thumb svg${i.wide?' wide':''}"><img src="${i.img}" alt=""></span>`;
  if (i.badge && i.badge.pill) return `<span class="thumb pill" style="background:${i.badge.c}">${esc(i.badge.t)}</span>`;
  if (i.badge){ const t=i.badge.t; return `<span class="thumb badge" style="background:${i.badge.c}">${/^\d+$/.test(t)?t:`<i data-lucide="${t}"></i>`}</span>`; }
  if (i.mono) return `<span class="thumb mono" style="--m:url('img/logo/${i.mono}.png')"></span>`;
  if (i.logo) return `<span class="thumb logo${INK.has(i.logo)?' ink':''}"><img src="img/logo/${i.logo}.png" alt="" loading="lazy" onload="if(this.naturalWidth>1.6*this.naturalHeight)this.parentNode.classList.add('wide')" onerror="this.remove()"></span>`;
  return `<span class="thumb plain"><i data-lucide="${i.icon||current.icon}"></i></span>`;
}
function itemHtml(i){
  const d=state.done[i.id], meta=metaFor(i), full=countDone(current)===current.items.length;
  const date = !d || !full || i.counter ? '' : d==='-'
    ? `<input type="date" class="adddate" max="${today()}" data-date="${i.id}" aria-label="Add date" title="Add date">`
    : `<input type="date" value="${d}" max="${today()}" data-date="${i.id}" aria-label="Date done"><button class="dateclr" data-clr="${i.id}" aria-label="Remove date" title="Remove date"><i data-lucide="x"></i></button>`;
  return `<li class="item${d?' done':''}">
    <input type="checkbox" ${d?'checked':''} ${i.counter?'disabled title="Log routes below"':''} data-id="${i.id}" aria-label="${esc(i.name)}">
    ${thumb(i)}
    <div class="body"><div class="name" data-pan="${i.id}">${esc(i.name)}</div>${meta?`<div class="meta">${esc(meta)}</div>`:''}${i.counter?counterHtml(i):''}</div>
    <div class="acts">${date}
      ${i.url?`<a class="icon" href="${esc(i.url)}" target="_blank" rel="noopener" aria-label="Website" title="Website"><i data-lucide="globe"></i></a>`:''}
      ${i.lat!=null?`<a class="icon" href="${mapsUrl(i)}" target="_blank" rel="noopener" aria-label="Open in Google Maps" title="Google Maps"><i data-lucide="map-pin"></i></a>`:''}
    </div></li>`;
}
function renderItems(){
  const l=current, items=visible();
  const html=groups(l).map(g=>{
    const gi=items.filter(i=>i.g===g); if(!gi.length) return '';
    const all=l.items.filter(x=>x.g===g), n=all.filter(x=>state.done[x.id]).length;
    return `<section class="card">${groups(l).length>1?`<h3><span>${esc(g)}</span><span class="${n===all.length?'full':''}">${n}/${all.length}</span></h3>`:''}<ul>${gi.map(itemHtml).join('')}</ul></section>`;
  }).join('');
  $('items').innerHTML = html || '<div class="empty">Nothing here.</div>';
  icons();
}
$('items').addEventListener('change',e=>{
  const t=e.target;
  if (t.dataset.id) toggle(t.dataset.id);
  else if (t.dataset.date){ state.done[t.dataset.date]=t.value||'-'; save(); render(false); }
});

// ---- bus route search: match by number or by name, only real routes ----
let sel=0;
function matches(q){
  q=q.trim().toLowerCase(); if(!q) return [];
  const nm=current.busNames||{}, pool=(current.bus||[]).filter(r=>!state.bus.includes(r));
  const exact=pool.filter(r=>r.toLowerCase()===q), num=pool.filter(r=>r!==q&&r.toLowerCase().startsWith(q)), name=pool.filter(r=>!r.toLowerCase().startsWith(q)&&(nm[r]||'').toLowerCase().includes(q));
  return [...exact,...num,...name];
}
function showSugg(inp){
  const box=$('sugg'), m=matches(inp.value), nm=current.busNames||{};
  sel=Math.min(sel,Math.max(m.length-1,0));
  box.hidden=!inp.value.trim(); inp.setAttribute('aria-expanded',String(!box.hidden));
  box.innerHTML = m.length ? m.slice(0,40).map((r,k)=>`<button type="button" role="option" class="${k===sel?'on':''}" data-pick="${esc(r)}"><b>${esc(r)}</b>${esc(nm[r]||'')}</button>`).join('') : '<div class="none">No matching route</div>';
}
$('items').addEventListener('input',e=>{ if (e.target.dataset.add){ sel=0; showSugg(e.target); } });
$('items').addEventListener('keydown',e=>{
  const t=e.target; if (!t.dataset.add) return;
  const m=matches(t.value);
  if (e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(m.length){ sel=(sel+(e.key==='ArrowDown'?1:-1)+m.length)%m.length; showSugg(t); $('sugg').querySelector('.on')?.scrollIntoView({block:'nearest'}); } }
  else if (e.key==='Enter'){ e.preventDefault(); if (m.length) addRoute(m[sel]); else if (t.value.trim()) toast('No matching route'); }
  else if (e.key==='Escape'){ t.value=''; $('sugg').hidden=true; }
});
$('items').addEventListener('focusout',e=>{ if (e.target.dataset.add) setTimeout(()=>{ const b=$('sugg'); if(b && !b.contains(document.activeElement)) b.hidden=true; },150); });
$('items').addEventListener('mousedown',e=>{ if (e.target.closest('[data-pick]')) e.preventDefault(); });
$('items').addEventListener('click',e=>{
  const pk=e.target.closest('[data-pick]');
  if (pk){ addRoute(pk.dataset.pick); return; }
  const clr=e.target.closest('[data-clr]');
  if (clr){ state.done[clr.dataset.clr]='-'; save(); render(false); return; }
  const rm=e.target.closest('[data-rm]');
  if (rm){ state.bus=state.bus.filter(r=>r!==rm.dataset.rm); syncCounter(); return; }
  const p=e.target.closest('[data-pan]'); if(!p) return;
  const m=markers[p.dataset.pan]; if(!m) return;
  map.setView(m.getLatLng(),15); m.openPopup();
  $('map').scrollIntoView({behavior:'smooth',block:'center'});
});
$('q').addEventListener('input',()=>{ renderItems(); renderMap(false); });
$('hideDone').addEventListener('change',()=>{ renderItems(); renderMap(false); });

function addRoute(v){
  if (!(current.bus||[]).includes(v) || state.bus.includes(v)) return;
  state.bus.push(v); sel=0;
  syncCounter();
}
function syncCounter(){
  const it=current.items.find(i=>i.counter);
  const was=!!state.done[it.id];
  if (state.bus.length>=it.counter && !was){ state.done[it.id]=today(); toast('5 routes ridden!'); }
  if (state.bus.length<it.counter && was) delete state.done[it.id];
  save(); render(false);
  const inp=document.querySelector('[data-add]'); if(inp) inp.focus();
}

function toggle(id){
  const wasFull=countDone(current)===current.items.length;
  if (state.done[id]) delete state.done[id]; else state.done[id]=today();
  save(); render(false);
  if (!wasFull && countDone(current)===current.items.length) toast(`${current.title} complete!`);
}

// ---- award / certificate ----
function renderAward(l,n,N){
  const el=$('award');
  if (n<N){
    el.className='award';
    el.innerHTML=`<span class="l"><i data-lucide="award"></i>Certificate unlocks at ${N}/${N}</span>`;
    return;
  }
  el.className='award ready';
  el.innerHTML=`<span class="l"><i data-lucide="award"></i><b>Complete${l.timed?' · '+bestTier(tierInfo(l)):''}</b></span>
    <form id="certForm"><input type="text" id="certName" placeholder="Your name" value="${esc(state.name)}" maxlength="60" required aria-label="Name for certificate">
    <button class="btn" type="submit"><i data-lucide="download"></i>Certificate</button></form>`;
  $('certForm').onsubmit=e=>{ e.preventDefault(); state.name=$('certName').value.trim(); save(); makeCert(l); };
}

function makeCert(l){
  const { jsPDF } = window.jspdf;
  const doc=new jsPDF({orientation:'landscape',unit:'pt',format:'letter'});
  const W=792,H=612, teal=[14,124,134], ink=[31,42,51], muted=[107,119,128];
  doc.setFillColor(250,246,239); doc.rect(0,0,W,H,'F');
  doc.setDrawColor(...teal); doc.setLineWidth(3); doc.rect(28,28,W-56,H-56);
  doc.setLineWidth(.8); doc.rect(38,38,W-76,H-76);
  doc.setFillColor(...teal); doc.circle(W/2,104,32,'F');
  doc.setFillColor(250,246,239); doc.triangle(W/2-19,118,W/2,88,W/2+19,118,'F');
  doc.setFillColor(...teal); doc.triangle(W/2-5,118,W/2+8,101,W/2+21,118,'F');
  doc.setTextColor(...muted); doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('SAN DIEGO COMPLETIONIST', W/2, 162, {align:'center', charSpace:2});
  doc.setTextColor(...ink); doc.setFont('times','bold'); doc.setFontSize(36);
  doc.text('Certificate of Completion', W/2, 204, {align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(13); doc.setTextColor(...muted);
  doc.text('This certifies that', W/2, 238, {align:'center'});
  doc.setFont('times','bolditalic'); doc.setFontSize(32); doc.setTextColor(...teal);
  doc.text(state.name || 'A San Diego Completionist', W/2, 280, {align:'center'});
  doc.setDrawColor(...muted); doc.setLineWidth(.5); doc.line(W/2-180,290,W/2+180,290);
  doc.setFont('helvetica','normal'); doc.setFontSize(13); doc.setTextColor(...muted);
  doc.text(`completed all ${l.items.length} ${l.unit} of`, W/2, 314, {align:'center'});
  doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(...ink);
  doc.text(l.title + (l.timed?' — '+bestTier(tierInfo(l)):''), W/2, 342, {align:'center'});
  const rows=l.items.map(i=>({n:i.name+(i.elev?` (${i.elev.toLocaleString()} ft)`:''), d:state.done[i.id]==='-'?'':state.done[i.id]})).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  const cols=rows.length<=8?1:rows.length<=30?2:rows.length<=60?3:4;
  const fs=rows.length<=8?11:rows.length<=30?8.5:rows.length<=60?7:5.5;
  const perCol=Math.ceil(rows.length/cols), colW=(W-150)/cols, lh=fs*1.4, top=372;
  doc.setFont('helvetica','normal'); doc.setFontSize(fs);
  rows.forEach((r,k)=>{
    const c=Math.floor(k/perCol), y=top+(k%perCol)*lh;
    const x=cols===1?W/2-150:75+c*colW, w=cols===1?300:colW-12;
    doc.setTextColor(...ink); doc.text(doc.splitTextToSize(r.n,w-fs*6)[0], x, y);
    doc.setTextColor(...muted); doc.text(r.d?fmtDate(r.d):'—', x+w, y, {align:'right'});
  });
  const last=rows.map(r=>r.d).filter(Boolean).sort().pop() || today();
  doc.setFontSize(10); doc.setTextColor(...muted);
  doc.text(`Completed ${fmtDate(last)}  ·  chasevarga.com/sd`, W/2, H-52, {align:'center'});
  doc.save(`${l.key}-certificate.pdf`);
}

// ---- theme ----
const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
function paintTheme(){ $('theme').innerHTML=`<i data-lucide="${isDark()?'sun':'moon'}"></i>`; icons(); }
$('theme').onclick=()=>{
  const t=isDark()?'light':'dark';
  document.documentElement.dataset.theme=t;
  try{ localStorage.setItem('sdpp.theme',t); }catch(e){}
  paintTheme(); renderMap(false);
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(!document.documentElement.dataset.theme){ paintTheme(); renderMap(false); } });
paintTheme();

render(true);
})();
</script>
